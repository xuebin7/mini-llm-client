[project]
name = "mini-llm-client"
version = "0.1.0"
description = "A minimal LLM client and agent runtime for learning and experimentation"
readme = "README.md"
authors = [
    { name = "developer", email = "xuebin7@163.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.2.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
mini-llm-client = "mini_llm_client:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
