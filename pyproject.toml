[project]
name = "mini-llm-client"
version = "0.1.0"
description = "A minimal LLM client and agent runtime for learning and experimentation"
readme = "README.md"
authors = [
    { name = "developer", email = "xuebin7@163.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "langchain-core>=1.6.13",
    "langchain-deepseek>=1.1.1",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.16",
    "llama-index-core>=0.14.25",
    "llama-index-embeddings-huggingface>=0.8.0",
    "mcp>=2.2.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
mini-llm-client = "mini_llm_client:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
norecursedirs = [
    "examples/coding_agent_demo",
]
